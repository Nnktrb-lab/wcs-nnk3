<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="description" content="Sudoku Learning Academy - belajar teknik Sudoku logik">
<title>Sudoku Learning Academy</title>
<style>
:root{
  --bg:#05070c;--bg2:#080c16;--panel:#0b1222;--panel2:#101a2e;--line:#1a2640;--line2:#253a60;
  --text:#e6edf9;--muted:#8b9bbb;--faint:#5d6c8c;
  --accent:#2f7bff;--accent2:#6aa5ff;--accent-soft:rgba(47,123,255,.16);--cyan:#6aa5ff;--cyan-soft:rgba(106,165,255,.13);
  --ok:#5b9dff;--ok-soft:rgba(91,157,255,.15);--warn:#a9bfe6;--warn-soft:rgba(169,191,230,.12);--err:#f05263;--err-soft:rgba(240,82,99,.15);
  --cell:#0a1120;--cell-hl:#0f1b33;--cell-sel:#1d3c7a;--cell-same:#152a52;--box:#3b5b94;--given:#e6edf9;--player:#5b9dff;--solver:#b4cfff;
  --radius:14px;--radius-sm:9px;--shadow:0 10px 30px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(47,123,255,.35),0 20px 60px -18px rgba(47,123,255,.55);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f4f7fd;--bg2:#eaf0fb;--panel:#ffffff;--panel2:#f2f6fd;--line:#dbe4f3;--line2:#c3d1ea;
  --text:#0c1730;--muted:#52617f;--faint:#8592ad;
  --accent:#1d5fe0;--accent2:#1849b4;--accent-soft:rgba(29,95,224,.10);--cyan:#2f6fd6;--cyan-soft:rgba(47,111,214,.09);
  --ok:#1d5fe0;--ok-soft:rgba(29,95,224,.10);--warn:#4d6390;--warn-soft:rgba(77,99,144,.10);--err:#d63345;--err-soft:rgba(214,51,69,.10);
  --cell:#ffffff;--cell-hl:#edf2fd;--cell-sel:#c7d9fc;--cell-same:#dce7fd;--box:#34548c;--given:#0c1730;--player:#1d5fe0;--solver:#4a73b5;
  --shadow:0 8px 24px rgba(20,40,90,.07);
  --glow:0 0 0 1px rgba(29,95,224,.22),0 18px 50px -20px rgba(29,95,224,.40);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}
/* Header */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none;color:var(--accent)}
.brand h1{font-size:15px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;transition:.15s}
.nav button:hover:not(:disabled){color:var(--text);background:var(--panel2)}
.nav button.active{color:var(--text);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.quick{display:flex;gap:6px}
.chip-btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:700;font-size:12px;color:var(--text)}
.chip-btn:hover{border-color:var(--accent)}
main{max-width:1480px;margin:0 auto;padding:18px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:14px}
.panel h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.panel h3{font-size:14px;margin:14px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
select,input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);width:100%;min-width:0}
textarea{resize:vertical;font-family:var(--mono);font-size:12px;min-height:62px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;color:var(--text)}
.btn:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel2))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent2)}
.btn.cyan{background:var(--cyan-soft);border-color:color-mix(in srgb,var(--cyan) 50%,transparent);color:var(--cyan)}
.btn.danger{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 45%,transparent);color:var(--err)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent2)}
[data-theme="light"] .btn.on{color:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:30px;padding:5px 9px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.badge.ok,.badge.COMPLETE,.badge.IMPLEMENTED{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.badge.warn,.badge.PARTIAL,.badge.BETA{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.badge.err,.badge.NOT_IMPLEMENTED{color:var(--err);background:var(--err-soft);border-color:transparent}
.badge.info,.badge.LEARNING_ONLY{color:var(--cyan);background:var(--cyan-soft);border-color:transparent}
.badge.acc{color:var(--accent2);background:var(--accent-soft);border-color:transparent}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.note{font-size:12px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line2);border-radius:var(--radius-sm);padding:9px 11px}
.note.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn);background:var(--warn-soft)}
/* Play layout */
.play-grid{display:grid;grid-template-columns:290px minmax(0,1fr) 380px;gap:18px;align-items:start}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.gamebar{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gamebar .stat{display:flex;flex-direction:column;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.gamebar .stat b{font-size:17px;color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.gamebar .stat b.danger{color:var(--err)}
/* Board */
.board-wrap{position:relative;width:100%;max-width:560px}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1/1;width:100%;background:var(--box);border:2.5px solid var(--box);border-radius:12px;overflow:hidden;gap:1px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cell{position:relative;background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:clamp(17px,4.6vw,28px);font-weight:600;cursor:pointer;transition:background .12s;font-variant-numeric:tabular-nums;min-width:0;min-height:0;overflow:hidden}
.cell.bR{box-shadow:inset -2px 0 0 var(--box)}
.cell.bB{box-shadow:inset 0 -2px 0 var(--box)}
.cell.bR.bB{box-shadow:inset -2px 0 0 var(--box),inset 0 -2px 0 var(--box)}
.cell.hl{background:var(--cell-hl)}
.cell.same{background:var(--cell-same)}
.cell.sel{background:var(--cell-sel)}
.cell .v{position:relative;z-index:2;line-height:1}
.cell.given .v{color:var(--given);font-weight:700}
.cell.player .v{color:var(--player)}
.cell.solver .v{color:var(--solver);font-style:italic}
.cell.wrong .v{color:var(--err)}
.cell.wrong{background:var(--err-soft)}
.cell.conflict::after{content:"";position:absolute;inset:2px;border:2px solid var(--err);border-radius:5px;z-index:3;pointer-events:none}
.cell.mismatch::after{content:"";position:absolute;inset:2px;border:2px dashed var(--warn);border-radius:5px;z-index:3;pointer-events:none}
.cell.r-unit{background:color-mix(in srgb,var(--cyan) 9%,var(--cell))}
.cell.r-primary{background:color-mix(in srgb,var(--accent) 30%,var(--cell))}
.cell.r-pivot{background:color-mix(in srgb,var(--accent) 55%,var(--cell))}
.cell.r-pincer{background:color-mix(in srgb,var(--cyan) 22%,var(--cell));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--cyan) 60%,transparent)}
.cell.r-colorA{background:color-mix(in srgb,var(--accent) 42%,var(--cell))}
.cell.r-colorB{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 16%,var(--cell)) 0 5px,var(--cell) 5px 10px)}
.cell.r-target{box-shadow:inset 0 0 0 3px var(--ok)}
.cell.r-elimcell{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--err) 70%,transparent)}
.cell.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--ok-soft)}100%{}}
.cell.pop .v{animation:pop .25s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:1}
.notes span{display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1.7vw,11.5px);color:var(--muted);font-weight:600;line-height:1;border-radius:4px}
.notes span.solv{color:var(--solver)}
.notes span.hlc{background:var(--accent-soft);color:var(--accent2)}
[data-theme="light"] .notes span.hlc{color:var(--accent)}
.notes span.inv{color:var(--err);text-decoration:line-through}
.notes span.keep{background:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--text);font-weight:800}
.notes span.elim{background:color-mix(in srgb,var(--err) 35%,transparent);color:var(--text);text-decoration:line-through;font-weight:800}
.notes span.place{background:var(--accent);color:#fff;font-weight:800}
.notes span.found{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--faint);text-decoration:line-through}
.cage{position:absolute;inset:3px;pointer-events:none;z-index:2;border:0 dashed color-mix(in srgb,var(--text) 45%,transparent)}
.cage.t{border-top-width:1.5px}.cage.b{border-bottom-width:1.5px}.cage.l{border-left-width:1.5px}.cage.r{border-right-width:1.5px}
.cage-sum{position:absolute;top:1px;left:3px;font-size:clamp(7px,1.5vw,10px);font-weight:800;color:var(--cyan);z-index:4;background:var(--cell);padding:0 1px;line-height:1.1;border-radius:3px}
.board.killer .notes{inset:9px 1px 1px 1px}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--panel) 96%,transparent);border-radius:12px;backdrop-filter:blur(8px);padding:20px}
.overlay h3{margin:0;font-size:20px}
.overlay .big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2)}
.pad{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pad button{aspect-ratio:1/1.1;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:clamp(16px,4vw,22px);font-weight:700;color:var(--text);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.pad button small{font-size:9.5px;color:var(--faint);font-weight:600}
.pad button:hover:not(:disabled){border-color:var(--accent)}
.pad button.done{opacity:.3}
.pad button.notemode{color:var(--cyan)}
.tools{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tools .btn{flex-direction:column;gap:2px;padding:6px 4px;font-size:11.5px;min-height:52px}
.tools .btn svg{width:18px;height:18px}
.msg{width:100%;max-width:560px;min-height:20px;font-size:13px;text-align:center;color:var(--muted)}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}
/* Explanation panel */
.xp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.xp-tech{font-size:18px;font-weight:800}
.xp-sec{border-left:3px solid var(--line2);padding:4px 0 4px 10px;margin:8px 0}
.xp-sec b{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--faint);margin-bottom:2px}
.xp-sec.a{border-color:var(--cyan)}.xp-sec.r{border-color:var(--accent)}.xp-sec.ac{border-color:var(--warn)}.xp-sec.res{border-color:var(--ok)}
.ba{font-family:var(--mono);font-size:11.5px;max-height:130px;overflow:auto;background:var(--panel2);border-radius:8px;padding:6px 8px;border:1px solid var(--line)}
.ba div{display:flex;justify-content:space-between;gap:10px}
.ba .x{color:var(--err)}.ba .p{color:var(--ok)}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.btn-grid.three{grid-template-columns:repeat(3,1fr)}
.btn-grid.four{grid-template-columns:repeat(4,1fr)}
.hist{max-height:220px;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:3px;margin-top:8px}
.hist div{padding:5px 8px;border-radius:7px;background:var(--panel2);border:1px solid transparent;display:flex;gap:6px}
.hist div.cur{border-color:var(--accent)}
.hist div.future{opacity:.45}
.hist div i{font-style:normal;color:var(--faint);min-width:22px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
/* Toast */
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;animation:tin .25s ease;text-align:center}
.toast.err{border-color:var(--err);color:var(--err)}.toast.ok{border-color:var(--ok);color:var(--ok)}.toast.warn{border-color:var(--warn);color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* Modal */
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(5,6,10,.6);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);text-align:center}
.modal h3{margin:0 0 6px;font-size:20px}
.modal .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
/* Learn */
.learn-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.tech-list{display:flex;flex-direction:column;gap:6px}
.tech-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.tech-item:hover,.tech-item.active{border-color:var(--accent)}
.tech-item .nm{font-weight:700}
.tech-item .meta{font-size:11px;color:var(--muted)}
.lib-detail h2.title{font-size:22px;text-transform:none;letter-spacing:0;color:var(--text)}
.lib-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lib-field{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.lib-field b{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.lib-field ol{margin:0;padding-left:18px}
.mini-wrap{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:14px;align-items:start}
.mini-wrap .board{border-radius:9px}
.mini-wrap .cell{font-size:clamp(12px,2.4vw,17px)}
.mini-wrap .notes span{font-size:clamp(6px,1vw,8.5px)}
/* Challenge */
.ch-grid{display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:18px;align-items:start}
.ch-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;font-size:13px}
.ch-item.active{border-color:var(--accent)}
.ch-item .ok{color:var(--ok);font-weight:800}
/* Stats */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat-card b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:4px}
.stat-card span{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px}
.tbl-wrap{overflow-x:auto}
/* Settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.toggle:last-child{border-bottom:0}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line2);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span::before{transform:translateX(18px);background:#fff}
/* Versus */
.vs-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.code-big{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:6px;color:var(--cyan);background:var(--panel2);border:1px dashed var(--line2);border-radius:12px;padding:8px 16px;display:inline-block}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.pl .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px}
.pl.agreed{border-color:var(--ok)}
.spk{width:10px;height:10px;border-radius:50%;background:var(--line2);display:inline-block;transition:.1s}
.spk.talk{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.countdown{font-size:90px;font-weight:900;color:var(--accent2);text-align:center}
.oppbar{width:100%;max-width:560px}
/* Chat (messenger style) */
.chat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.chat-head .who b{display:block;font-size:14px}
.chat-head .who small{color:var(--ok);font-size:11.5px}
.chat-body{height:230px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px);background-size:16px 16px}
.bub{max-width:78%;padding:7px 10px 5px;border-radius:12px;font-size:13.5px;position:relative;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 80%,#000);color:#fff;border-bottom-right-radius:3px}
[data-theme="light"] .bub.me{background:#dbe7ff;color:#0c1730}
.bub.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
.bub.emo{font-size:28px;background:transparent!important;box-shadow:none;border:0;padding:0 4px}
.bub .meta{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:2px}
.bub .tick.read{color:var(--cyan)}
.bub.sys{align-self:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:4px 10px}
.chat-tools{padding:8px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:7px}
.emoji-row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-row button{font-size:20px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 0;line-height:1.2}
.phr-row{display:flex;gap:5px;flex-wrap:wrap}
.phr-row button{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600}
.emoji-row button:hover,.phr-row button:hover{border-color:var(--accent)}
.compose{display:flex;gap:6px}
.compose input{border-radius:999px}
.float-emo{position:absolute;z-index:30;font-size:54px;pointer-events:none;animation:floatup 2.2s ease-out forwards;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
@keyframes floatup{0%{opacity:0;transform:translateY(20px) scale(.5)}15%{opacity:1;transform:translateY(0) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1)}}
/* Logo mark */
.footer{max-width:1480px;margin:0 auto;padding:10px 18px 30px;color:var(--faint);font-size:11.5px;text-align:center}
/* Responsive */
@media (max-width:1280px){
  .play-grid{grid-template-columns:minmax(0,1fr) 360px}
  .ch-grid{grid-template-columns:280px minmax(0,1fr)}
  .ch-grid .ch-side{grid-column:1/-1}
}
@media (max-width:980px){
  .play-grid,.learn-grid,.ch-grid,.vs-grid{grid-template-columns:minmax(0,1fr)}
  .lib-fields,.mini-wrap{grid-template-columns:minmax(0,1fr)}
  .mini-wrap .board-wrap{max-width:360px;margin:0 auto}
}
@media (max-width:620px){
  main{padding:10px}
  .panel{padding:13px}
  .tools{grid-template-columns:repeat(5,1fr);gap:4px}
  .tools .btn{font-size:10px;min-height:48px;padding:4px 2px}
  .pad{gap:4px}
  .pad button{border-radius:8px}
  .btn-grid.four{grid-template-columns:repeat(2,1fr)}
  .players{grid-template-columns:1fr}
  .code-big{font-size:24px;letter-spacing:4px}
  .countdown{font-size:64px}
  .board{border-radius:9px}
}
/* Stable layout while bot runs: fixed-height scroll areas so controls below never move */
#xpBody{height:300px;overflow-y:auto;overscroll-behavior:contain}
.hist{height:180px;max-height:none;overscroll-behavior:contain}
@media (max-width:700px){#xpBody{height:260px}.hist{height:150px}}
/* Mobile: board first, compact nav that always fits */
@media (max-width:980px){ .play-grid .center{order:-1} }
@media (max-width:620px){
  #xpBody{height:220px}.hist{height:120px}
}
.pad{grid-template-columns:repeat(9,minmax(0,1fr))}.pad button{min-width:0}
.tools{grid-template-columns:repeat(5,minmax(0,1fr))}.tools .btn{min-width:0;overflow:hidden}
@media (max-width:360px){.pad{gap:3px}.tools .btn{font-size:9px}}

/* ===== v2.1 professional shell (two-tone: black/white + blue) ===== */
body{background:radial-gradient(1100px 600px at 12% -10%,rgba(47,123,255,.13),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(47,123,255,.07),transparent 60%),var(--bg);background-attachment:fixed}
[data-theme="light"] body{background:radial-gradient(1100px 600px at 12% -10%,rgba(29,95,224,.08),transparent 60%),var(--bg)}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:12px 24px;height:66px}
.brand .logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 6px 16px rgba(47,123,255,.45))}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font-size:17px;letter-spacing:4px;font-weight:800}
.brand-t small{font-size:10px;letter-spacing:2.6px;color:var(--accent2);font-weight:700;margin-top:3px}
[data-theme="light"] .brand-t small{color:var(--accent)}
.tagline{color:var(--muted);font-size:12.5px;letter-spacing:.4px;padding-left:18px;border-left:1px solid var(--line)}
.quick{margin-left:auto}
.chip-btn{min-width:40px;height:36px;padding:0 12px}
.chip-btn:hover{border-color:var(--accent);color:var(--accent2)}
.sidebar{position:sticky;top:66px;height:calc(100vh - 66px);display:flex;flex-direction:column;gap:16px;padding:18px 14px;border-right:1px solid var(--line);overflow-y:auto;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.nav{display:flex;flex-direction:column;gap:4px;margin:0}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;font-size:13.5px;border:1px solid transparent;color:var(--muted);background:transparent;font-weight:600;transition:.15s}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover:not(:disabled){background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--text);border-color:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.nav button.active svg{color:var(--accent2)}
[data-theme="light"] .nav button.active svg{color:var(--accent)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.side-progress{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;margin-bottom:4px;transition:background .4s}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.sp-t{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.side-progress .bar{width:100%}
main{max-width:1500px;width:100%;margin:0;padding:22px 26px;min-width:0}
.play-grid{grid-template-columns:minmax(0,1fr) 380px;gap:22px}
.center{align-items:center}
.center>*{width:100%;max-width:600px}
.ctrlbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) auto;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.ctrlbar .btn.primary{min-height:38px;padding:8px 16px}
.ctrlbar .btn svg{width:15px;height:15px}
.idrow{display:flex;gap:6px}.idrow input{flex:1;min-width:0}.idrow .btn{flex:none}
.custom-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.gamebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;max-width:600px;align-items:stretch}
.gamebar .stat{flex-direction:row;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;text-transform:none;letter-spacing:0}
.gamebar .stat>div{display:flex;flex-direction:column;min-width:0}
.gamebar .stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gamebar .stat b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gamebar .stat i{width:32px;height:32px;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center}
[data-theme="light"] .gamebar .stat i{color:var(--accent)}
.gamebar .stat i svg{width:17px;height:17px}
.gamebar .stat.hidden{display:none!important}
.pausebtn{height:100%;min-height:50px;border-radius:12px}
.pausebtn svg{width:16px;height:16px}
.board{box-shadow:var(--glow);border-radius:14px}
.right .panel{border-radius:var(--radius)}
.panel h2 .dot{box-shadow:0 0 0 3px var(--accent-soft)}
.footer{max-width:none;padding:22px 0 8px}
@media (max-width:1280px){
  .shell{grid-template-columns:208px minmax(0,1fr)}
  .play-grid{grid-template-columns:minmax(0,1fr) 340px}
}
@media (max-width:1100px){
  .play-grid{grid-template-columns:minmax(0,1fr)}
  .play-grid .center{order:-1}
  .right{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  .right .panel+.panel{margin-top:0}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{padding:10px 14px;height:58px;gap:10px}
  .tagline{display:none}
  .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:60;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);overflow:visible}
  .side-progress{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;text-align:center;border-radius:10px;box-shadow:none}
  .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav button.active{box-shadow:none}
  body{padding-bottom:76px}
  main{padding:14px}
  .right{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  main{padding:10px}
  .brand .logo{width:32px;height:32px}
  .brand-t b{font-size:15px;letter-spacing:3px}
  .brand-t small{font-size:9px;letter-spacing:1.8px}
  .ctrlbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:10px;gap:8px}
  .ctrlbar .idfld{grid-column:1/-1}
  .ctrlbar #btnNew{grid-column:1/-1}
  .gamebar{grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:5px}
  .gamebar .stat{padding:7px 6px;gap:0;justify-content:center;text-align:center}
  .gamebar .stat>div{align-items:center}
  .gamebar .stat i{display:none}
  .gamebar .stat span{font-size:9px;letter-spacing:.3px}
  .gamebar .stat b{font-size:13.5px}
  .pausebtn{min-height:44px;padding:4px 9px}
  .pausebtn span{display:none}
}
.gamebar .stat{gap:8px;padding:8px 9px}
.gamebar .stat i{width:28px;height:28px}
.gamebar .stat span{text-transform:none;letter-spacing:.1px;font-size:11px;font-weight:600}
@media (max-width:860px){
  .toasts,#toasts{bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
@media (max-width:620px){
  .center>.ctrlbar{order:10}
  .center>#killerNote,.center>.custom-box{order:11}
}
/* v2.2: ranked, friends, voice tuning */
.vs-side{display:flex;flex-direction:column;gap:0;min-width:0}
.vs-side>div{display:flex;flex-direction:column;gap:0;min-width:0}
.rk-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}
.rk-tier{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);flex:none}
.rk-tier.t-master,.rk-tier.t-gm,.rk-tier.t-diamond{background:var(--accent);color:#fff}
.rk-main{flex:1;min-width:140px}
.rk-r b{font-size:26px;font-family:var(--mono);letter-spacing:.5px}
.rk-on{min-width:0;flex:1 1 200px}
.rk-on .toggle{margin:0;padding:0;border:0}
.rk-hist{display:flex;flex-direction:column;gap:6px}
.rk-row,.fr-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);min-width:0}
.rk-opp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.fr-list{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:320px;overflow-y:auto}
.fr-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.fr-who b,.fr-who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frReqs .fr-row{margin-top:6px}
.pres{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.pres.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.code-mid{font-family:var(--mono);font-size:18px;font-weight:800;letter-spacing:2px;color:var(--accent)}
.ok-t{color:var(--accent)}.err-t{color:var(--err)}
.elo-delta{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--accent)}
.vq{margin-top:8px;padding:6px 9px;border-radius:var(--radius-sm);background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;word-break:break-word}
.vq:empty{display:none}
.vq.good{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.vq.mid{color:var(--warn)}
.vq.bad{border-color:color-mix(in srgb,var(--err) 50%,transparent);color:var(--err)}
.vctl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vctl .fld>span{display:flex;justify-content:space-between;gap:6px}
.vctl select{width:100%;min-width:0;max-width:100%}
.vctl .toggle{margin:0}
.lvl{height:6px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.lvl>i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
@media (max-width:620px){.rk-r b{font-size:22px}.rk-row,.fr-row{padding:6px 8px}.fr-row .btn.sm{padding:5px 8px}}

</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="Sudoku Learning Academy">
      <rect x="1.5" y="1.5" width="37" height="37" rx="10" fill="var(--accent)"/>
      <path d="M14 6v28M26 6v28M6 14h28M6 26h28" stroke="#fff" stroke-opacity=".45" stroke-width="1.4"/>
      <rect x="15.5" y="15.5" width="9" height="9" rx="2.2" fill="#fff"/>
    </svg>
    <div class="brand-t"><b>SUDOKU</b><small>LEARNING ACADEMY</small></div>
  </div>
  <div class="tagline" data-i18n="tagline"></div>
  <div class="quick">
    <button class="chip-btn" id="qLang" aria-label="Language">BM</button>
    <button class="chip-btn" id="qTheme" aria-label="Theme">☾</button>
  </div>
</header>
<aside class="sidebar">
  <nav class="nav" id="nav">
      <button data-view="play" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg><span data-i18n="nav_play"></span></button>
      <button data-view="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7l10-4 10 4-10 4z"/><path d="M6 9v5c0 1.7 2.7 3 6 3s6-1.3 6-3V9"/><path d="M22 7v6"/></svg><span data-i18n="nav_learn"></span></button>
      <button data-view="challenge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg><span data-i18n="nav_challenge"></span></button>
      <button data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav_stats"></span></button>
      <button data-view="versus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 2.7-5 6-5s6 2 6 5M14 15.3c.6-.2 1.3-.3 2-.3 3.3 0 6 2 6 5"/></svg><span data-i18n="nav_versus"></span></button>
      <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span data-i18n="nav_settings"></span></button>
  </nav>
  <div class="side-progress">
    <div class="ring" id="progRing"><span id="progPct">0%</span></div>
    <div class="sp-t" data-i18n="progress_title"></div>
    <div class="small" id="progText"></div>
    <div class="bar"><i id="progBar" style="width:0"></i></div>
    <div class="tiny muted" id="progText2"></div>
  </div>
</aside>
<main>
<!-- ================= PLAY ================= -->
<section class="view active" id="view-play">
  <div class="play-grid">
    <div class="center">
      <div class="ctrlbar">
        <label class="fld"><span data-i18n="variant"></span>
          <select id="selVariant"><option value="classic" data-i18n="classic"></option><option value="killer" data-i18n="killer"></option></select>
        </label>
        <label class="fld" id="fldDiff"><span data-i18n="difficulty"></span>
          <select id="selDiff">
            <option value="easy" data-i18n="d_easy"></option><option value="medium" data-i18n="d_medium"></option><option value="hard" data-i18n="d_hard"></option>
            <option value="master" data-i18n="d_master"></option><option value="extreme" data-i18n="d_extreme"></option><option value="custom" data-i18n="d_custom"></option>
          </select>
        </label>
        <label class="fld idfld"><span data-i18n="puzzle_id"></span>
          <div class="idrow"><input type="text" id="inpId" maxlength="16" autocomplete="off" spellcheck="false" placeholder="E-XXXXXXXX"><button class="btn" id="btnLoadId" data-i18n="btn_load_id"></button></div>
        </label>
        <button class="btn primary" id="btnNew"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span data-i18n="btn_new"></span></button>
      </div>
      <div class="note hidden" id="killerNote" data-i18n="kl_beta_note"></div>
      <div id="customBox" class="col hidden custom-box">

/* Replay the logical solver on an example puzzle until the target technique is the next step */
function techExampleState(techId) {
  var ps = (typeof TECH_EXAMPLES !== 'undefined') && TECH_EXAMPLES[techId];
  if (!ps) return null;
  var g = Engine.parse(ps); if (!g) return null;
  var sol = Engine.solve(g, { limit: 2 }); if (sol.count !== 1) return null;
  var S = Logic.makeState(g), n = 0;
  while (!Logic.isSolved(S) && n++ < 400) {
    var st = Logic.findStep(S, { solution: sol.solution });
    if (!st) return null;
    if (st.tech === techId) return { state: S, step: st, puzzle: g, solution: sol.solution };
    Logic.applyStep(S, st);
  }
  return null;
}

  function load() {

  return n;
}

  box.appendChild(n); setTimeout(function () { n.style.opacity = '0'; n.style.transition = 'opacity .3s'; }, 2600); setTimeout(function () { n.remove(); }, 3000);
  while (box.children.length > 3) box.firstChild.remove();
}

    if (topic === base + 'in') onDirect(m, f, n);
  }
  function onDirect(m, f, n) {
    if (limited(f + m.t, 300)) return;
    var name = nm(m.n), r = clampR(m.r);
    if (m.t === 'prop') {
      if (mm && !mm.lock && !MP.active() && Math.abs(r - prof.rating) <= win()) {
        mm.lock = { id: f, role: 'acc', exp: n + 6000, n: name, r: r };
        pub(P + 'u/' + f + '/in', { t: 'acc', n: myName(), r: prof.rating });
      } else pub(P + 'u/' + f + '/in', { t: 'no' });
    } else if (m.t === 'acc') {
      if (!mm || !mm.lock || mm.lock.id !== f || mm.lock.role !== 'prop' || MP.active()) { pub(P + 'u/' + f + '/in', { t: 'no' }); return; }
      var rk = { oppId: f, oppName: name, oppR: r, myR: prof.rating, diff: diffFor((prof.rating + r) / 2) };
      var code = MP.rid(6);
      mmStop(true); setMsg(t('rk_found', { n: name, r: r }));
      APP.showView('versus');
      MP.create({ code: code, meId: prof.id, expect: f, ranked: rk, onReady: function () { pub(P + 'u/' + f + '/in', { t: 'go', code: code, d: rk.diff, n: myName(), r: prof.rating }); }, onFail: function () { setMsg(t('rk_fail')); } });
      setTimeout(function () { var st = MP._debug.state(); if (st && st.code === code && !st.opp) { MP.leave(true); toast(t('rk_fail'), 'warn'); setMsg(t('rk_fail')); } }, 25000);
    } else if (m.t === 'no') {
      if (mm && mm.lock && mm.lock.id === f) { mm.lock = null; mm.skip[f] = n + 15000; }
    } else if (m.t === 'go') {
      if (!mm || !mm.lock || mm.lock.id !== f || mm.lock.role !== 'acc' || MP.active()) return;
      if (typeof m.code !== 'string' || !CODE_RE.test(m.code) || DIFFS.indexOf(m.d) < 0) return;
      var rk2 = { oppId: f, oppName: name, oppR: r, myR: prof.rating, diff: m.d };
      mmStop(true); setMsg(t('rk_found', { n: name, r: r }));
      APP.showView('versus');
      MP.join(m.code, { meId: prof.id, expect: f, ranked: rk2 });
    } else if (m.t === 'inv') {
      if (!prof.friends[f]) return; // only friends may invite
      if (typeof m.code !== 'string' || !CODE_RE.test(m.code)) return;
      if (MP.active() || mm || invPending) { pub(P + 'u/' + f + '/in', { t: 'invno', why: 'busy' }); return; }
      invPending = { f: f, code: m.code, exp: n + 60000 };
      var exp = setTimeout(function () { if (invPending && invPending.code === m.code) { invPending = null; clear($('modalRoot')); } }, 60000);
      modal(t('fr_inv_title'), t('fr_inv_body', { n: prof.friends[f].n || name }), [
        { label: t('fr_inv_ok'), cls: 'primary', fn: function () { clearTimeout(exp); invPending = null; if (MP.active()) return; APP.showView('versus'); MP.join(m.code, { meId: prof.id, expect: f }); } },
        { label: t('fr_inv_no'), fn: function () { clearTimeout(exp); invPending = null; pub(P + 'u/' + f + '/in', { t: 'invno', why: 'no' }); } }
      ]);
    } else if (m.t === 'invno') {
      var st = MP._debug.state();
      if (st && st.expect === f && !st.opp) { toast(t('fr_inv_declined', { n: (prof.friends[f] || {}).n || name }), 'warn'); MP.leave(true); }
    }
  }

  /* ---------- Matchmaking ---------- */
  function win() { return mm ? Math.min(1000, 100 + Math.floor((now() - mm.since) / 1000) * 10) : 100; }
  function findMatch() {
    if (MP.active()) { toast(t('rk_busy'), 'warn'); return; }
    if (mm) return;
    if (!myName()) { toast(t('rk_needname'), 'warn'); var ni = $('vsName'); if (ni) ni.focus(); return; }
    if (!APP.settings().online) setOnline(true);
    mm = { since: now(), seek: {}, lock: null, skip: {} };
    if (cli) cli.subscribe(P + 'mm');
    clearInterval(mmT); mmT = setInterval(mmTick, 2000); mmTick();
    presence(); renderAll();
  }
  function mmTick() {
    if (!mm) return;
    if (!cli) { renderAll(); return; }
    pub(P + 'mm', { t: 'seek', n: myName(), r: prof.rating });
    var n = now(), w = win();
    Object.keys(mm.seek).forEach(function (id) { if (n - mm.seek[id].ts > 7000) delete mm.seek[id]; });
    if (mm.lock && n > mm.lock.exp) { mm.skip[mm.lock.id] = n + 10000; mm.lock = null; }
    if (!mm.lock) {
      var best = null, bd = 1e9;
      Object.keys(mm.seek).forEach(function (id) {
        if (id <= prof.id) return; // only the lower id proposes, avoids crossed proposals
        if (mm.skip[id] && mm.skip[id] > n) return;
        var d = Math.abs(mm.seek[id].r - prof.rating);
        if (d <= w && d < bd) { bd = d; best = id; }
      });
      if (best) { mm.lock = { id: best, role: 'prop', exp: n + 5000, n: mm.seek[best].n, r: mm.seek[best].r }; pub(P + 'u/' + best + '/in', { t: 'prop', n: myName(), r: prof.rating }); }
    }
    renderAll();
  }
  function mmStop(silent) {
    if (!mm) return;
    clearInterval(mmT); mm = null;
    if (cli) pub(P + 'mm', { t: 'cancel' });
    if (!silent) setMsg('');
    presence(); renderAll();
  }

  /* ---------- Friends ---------- */
  function addFriend(raw) {
    var id = String(raw || '').replace(/[^a-z0-9]/gi, '').toLowerCase();
    if (!ID_RE.test(id)) { toast(t('fr_badid'), 'err'); return; }
    if (id === prof.id) { toast(t('fr_self'), 'warn'); return; }
    if (prof.friends[id]) { toast(t('fr_already'), 'warn'); return; }
    if (!cli) { toast(t('fr_need_online'), 'warn'); return; }
    if (prof.inReq[id]) { acceptReq(id); return; }
    if (Object.keys(prof.outReq).length >= 20) { toast(t('fr_too_many'), 'warn'); return; }
    prof.outReq[id] = { ts: now(), n: (online[id] || {}).n || '' }; save();
    pub(P + 'u/' + id + '/req/' + prof.id, { n: myName(), r: prof.rating, ts: now() }, true);
    cli.subscribe(P + 'u/' + id + '/p');
    toast(t('fr_sent'), 'ok'); renderAll();
  }
  function acceptReq(id, info) {
    if (!cli) { toast(t('fr_need_online'), 'warn'); return; }
    var q = info || prof.inReq[id] || {};
    prof.friends[id] = Object.assign(prof.friends[id] || { since: now() }, { n: q.n || '?', r: q.r || 1200 });
    delete prof.inReq[id]; delete prof.outReq[id]; save();
    pub(P + 'u/' + id + '/acc/' + prof.id, { n: myName(), r: prof.rating }, true);
    clearRetained(P + 'u/' + prof.id + '/req/' + id);
    subFriend(id); toast(t('fr_now', { n: prof.friends[id].n }), 'ok'); renderAll();
  }
  function rejectReq(id) {
    delete prof.inReq[id]; save();
    clearRetained(P + 'u/' + prof.id + '/req/' + id); renderAll();
  }
  function removeFriend(id) {
    var f = prof.friends[id]; if (!f) return;
    confirmBox(t('fr_remove_q', { n: f.n || fmtId(id) }), function () { delete prof.friends[id]; save(); renderAll(); });
  }
  function isOn(f) { return f && f.s && f.s !== 'off' && now() - (f.ts || 0) < 150000; }
  function invite(id) {
    var f = prof.friends[id]; if (!f) return;
    if (MP.active() || mm) { toast(t('rk_busy'), 'warn'); return; }
    if (!cli) { toast(t('fr_need_online'), 'warn'); return; }
    var code = MP.rid(6);
    APP.showView('versus');
    MP.create({ code: code, meId: prof.id, expect: id, onReady: function () { pub(P + 'u/' + id + '/in', { t: 'inv', code: code, n: myName(), r: prof.rating }); toast(t('fr_inv_sent', { n: f.n }), 'ok'); } });
    setTimeout(function () { var st = MP._debug.state(); if (st && st.code === code && !st.opp) { MP.leave(true); toast(t('fr_inv_expired'), 'warn'); } }, 65000);
  }

  /* ---------- UI ---------- */
  function dis(b, d) { b.disabled = !!d; return b; }
  function setMsg(s) { var m = $('rkMsg'); if (m) m.textContent = s; }
  function scheduleRender() { if (uiT) return; uiT = setTimeout(function () { uiT = null; renderAll(); }, 250); }
  function stLabel(s) { return t('pr_' + (s || 'off')); }
  function renderAll() {
    if (!prof || !$('rkPanel')) return;
    var tr = tier(prof.rating);
    $('rkRating').textContent = prof.rating;
    $('rkTier').textContent = tierName(prof.rating);
    $('rkTierIcon').textContent = tr.ic; $('rkTierIcon').className = 'rk-tier t-' + tr.k;
    $('rkRecord').textContent = t('rk_record', { w: prof.wins, l: prof.losses, g: prof.games, p: prof.peak || prof.rating, k: kf() });
    $('snOnline').checked = !!APP.settings().online;
    var ss = $('snStatus');
    ss.textContent = conn === 'on' ? t('sn_on', { b: broker, n: Object.keys(online).length }) : conn === 'connecting' ? t('sn_connecting') : conn === 'err' ? t('sn_err') : t('sn_off');
    ss.className = 'tiny ' + (conn === 'on' ? 'ok-t' : conn === 'err' ? 'err-t' : 'muted');
    $('rkFind').classList.toggle('hidden', !!mm); $('rkCancel').classList.toggle('hidden', !mm);
    $('rkFind').disabled = MP.active();
    if (mm) {
      var sec = Math.floor((now() - mm.since) / 1000), others = Object.keys(mm.seek).length;
      setMsg(!cli ? t('sn_connecting') : mm.lock ? t('rk_lock', { n: mm.lock.n, r: mm.lock.r }) : t('rk_searching', { s: fmtTime(sec * 1000), w: win(), c: others }));
    }
    var h = $('rkHist'); clear(h);
    if (!prof.hist.length) h.appendChild(el('div', { class: 'tiny muted', text: t('rk_nohist') }));
    prof.hist.slice(0, 10).forEach(function (x) {
      h.appendChild(el('div', { class: 'rk-row' }, [
        el('span', { class: 'badge ' + (x.res === 'W' ? 'ok' : 'err'), text: x.res === 'W' ? t('rk_w') : t('rk_l') }),
        el('span', { class: 'rk-opp', text: (x.opp || '?') + ' (' + x.or + ')' + (x.ab ? ' · ' + t('rk_abandon') : '') }),
        el('b', { class: x.delta >= 0 ? 'ok-t' : 'err-t', text: (x.delta >= 0 ? '+' : '') + x.delta }),
        el('span', { class: 'tiny muted', text: String(x.r) })
      ]));
    });
    // friends
    $('frMyId').textContent = fmtId(prof.id);
    var rq = $('frReqs'); clear(rq);
    var ins = Object.keys(prof.inReq), outs = Object.keys(prof.outReq);
    if (ins.length) {
      rq.appendChild(el('h3', { text: t('fr_reqs') + ' (' + ins.length + ')' }));
      ins.forEach(function (id) {
        var q = prof.inReq[id];
        rq.appendChild(el('div', { class: 'fr-row' }, [
          el('div', { class: 'fr-who' }, [el('b', { text: q.n }), el('span', { class: 'tiny muted', text: fmtId(id) + ' · ' + q.r })]),
          el('button', { class: 'btn sm primary', text: t('fr_accept'), onclick: function () { acceptReq(id); } }),
          el('button', { class: 'btn sm', text: t('fr_reject'), onclick: function () { rejectReq(id); } })
        ]));
      });
    }
    if (outs.length) rq.appendChild(el('div', { class: 'tiny muted', style: 'margin-top:6px', text: t('fr_out', { n: outs.length }) }));
    var fl = $('frList'); clear(fl);
    var fids = Object.keys(prof.friends);
    if (!fids.length) fl.appendChild(el('div', { class: 'tiny muted', text: t('fr_none') }));
    fids.sort(function (a, b) { return (isOn(prof.friends[b]) ? 1 : 0) - (isOn(prof.friends[a]) ? 1 : 0); }).forEach(function (id) {
      var f = prof.friends[id], on = isOn(f), s = on ? f.s : 'off';
      fl.appendChild(el('div', { class: 'fr-row' }, [
        el('i', { class: 'pres ' + (on ? 'on' : 'off') }),
        el('div', { class: 'fr-who' }, [el('b', { text: f.n || '?' }), el('span', { class: 'tiny muted', text: (f.r || 1200) + ' · ' + stLabel(s) })]),
        dis(el('button', { class: 'btn sm primary', text: t('fr_invite'), onclick: function () { invite(id); } }), !(on && (s === 'on' || s === 'mm') && cli && !MP.active())),
        el('button', { class: 'btn sm icon', 'aria-label': t('fr_remove'), title: t('fr_remove'), text: '×', onclick: function () { removeFriend(id); } })
      ]));
    });
    // online players
    prune();
    var ol = $('olList'); clear(ol);
    var oids = Object.keys(online).sort(function (a, b) { return online[b].r - online[a].r; });
    $('olCount').textContent = oids.length;
    if (!cli) ol.appendChild(el('div', { class: 'tiny muted', text: t('ol_off') }));
    else if (!oids.length) ol.appendChild(el('div', { class: 'tiny muted', text: t('ol_none') }));
    oids.slice(0, 30).forEach(function (id) {
      var o = online[id], fr = !!prof.friends[id], pend = !!prof.outReq[id];
      ol.appendChild(el('div', { class: 'fr-row' }, [
        el('i', { class: 'pres on' }),
        el('div', { class: 'fr-who' }, [el('b', { text: o.n }), el('span', { class: 'tiny muted', text: o.r + ' · ' + tierName(o.r) + ' · ' + stLabel(o.s) })]),
        dis(el('button', { class: 'btn sm', text: fr ? t('fr_is') : pend ? t('fr_pending') : t('fr_add'), onclick: function () { addFriend(id); } }), fr || pend)
      ]));
    });
  }
  function onPhase(ph) {
    if (ph !== phase) { var prev = phase; phase = ph; presence(); if (ph === 'home' && prev !== 'home' && !mm) setMsg(''); }
    var home = ph === 'home';
    var a = $('vsSocial'), b = $('rkPanel');
    if (a) a.classList.toggle('hidden', !home);
    if (b) b.classList.toggle('hidden', !home);
    if (home) scheduleRender();
  }
  function bindTurn() {
    var tu = APP.settings().turn || {};
    $('turnUrl').value = tu.url || ''; $('turnUser').value = tu.user || ''; $('turnPass').value = tu.pass || '';
    var st = function () { var c = APP.settings().turn; $('turnState').textContent = c && c.url ? t('turn_on') : t('turn_none'); };
    $('turnSave').onclick = function () {
      var url = $('turnUrl').value.trim();
      if (url && !/^(turns?|stun):[A-Za-z0-9.\-\[\]:]+(\?transport=(udp|tcp))?$/.test(url)) { toast(t('turn_bad'), 'err'); return; }
      APP.setSetting('turn', url ? { url: url, user: $('turnUser').value.slice(0, 120), pass: $('turnPass').value.slice(0, 200) } : null);
      toast(t('turn_saved'), 'ok'); st();
    };
    $('turnClear').onclick = function () { APP.setSetting('turn', null); $('turnUrl').value = $('turnUser').value = $('turnPass').value = ''; st(); };
    st();
  }
  function init() {
    load();
    $('snOnline').onchange = function () { setOnline(this.checked); };
    $('rkFind').onclick = findMatch;
    $('rkCancel').onclick = function () { mmStop(); };
    $('frAdd').onclick = function () { addFriend($('frIdIn').value); $('frIdIn').value = ''; };
    $('frIdIn').onkeydown = function (e) { if (e.key === 'Enter') $('frAdd').click(); e.stopPropagation(); };
    $('frCopy').onclick = function () {
      var s = fmtId(prof.id);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(function () { toast(t('fr_copied'), 'ok'); }, function () { toast(s); });
      else toast(s);
    };
    window.addEventListener('beforeunload', function () { if (cli) { try { cli.publish(P + 'u/' + prof.id + '/p', JSON.stringify({ v: 2, f: prof.id, s: 'off', ts: now() }), true); } catch (e) { } } });
    bindTurn();
    if (APP.settings().online) connect();
    renderAll(); onPhase(MP.phase());
  }
  return {
    init: init, findMatch: findMatch, cancel: mmStop, onPhase: onPhase, rankedStart: rankedStart, rankedEnd: rankedEnd, render: renderAll,
    addFriend: addFriend, invite: invite, setOnline: setOnline, tierName: tierName, expected: expected, eloDelta: eloDelta, diffFor: diffFor,
    _debug: { prof: function () { return prof; }, online: function () { return online; }, mm: function () { return mm; }, conn: function () { return conn; } }
  };
})();

/* BOOT */
document.addEventListener('DOMContentLoaded',function(){try{UIX.bindSettings();}catch(e){console.error(e);}APP.init();try{MP.init();}catch(e){console.error('MP init failed',e);}try{Social.init();}catch(e){console.error('Social init failed',e);}});
</script>
